# Infrastructure de DriveEasy.
# Zipkin (tracage distribue) - http://localhost:9411
# Aucune base de donnees : le cahier des charges impose un stockage en memoire (RAM).
services:
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: driveeasy-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
